name: Баг
description: Что-то работает не так, как ожидалось
title: "[Баг] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт! Сначала загляни в [FAQ / Решение проблем](https://github.com/moonlivedt-oss/custom_VScode#faq--решение-проблем) — частые случаи (фон пропал, нет кнопки BG, перенос папки) уже разобраны.
  - type: textarea
    id: what
    attributes:
      label: Что произошло
      description: Опиши проблему кратко и по делу.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Пошагово — что нажимал(а), что открыл(а).
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидал(а)
      description: Как должно было быть.
    validations:
      required: false
  - type: input
    id: plugin-version
    attributes:
      label: Версия плагина
      description: "Строка из консоли: Help → Toggle Developer Tools → `[MoonLight custom-bg] v…`"
      placeholder: "v19"
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: Версия VS Code (или форка)
      placeholder: "1.95.0 · VS Code / Cursor / VSCodium / Windsurf"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: ОС
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Тема VS Code
      options:
        - Тёмная
        - Светлая
    validations:
      required: false
  - type: textarea
    id: console
    attributes:
      label: Консоль
      description: "Ошибки (красным) из Help → Toggle Developer Tools → Console, если есть."
      render: shell
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: Скриншот / GIF
      description: По возможности приложи изображение — перетащи его прямо сюда.
    validations:
      required: false
